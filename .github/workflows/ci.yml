name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Install Python dependencies
        run: python -m pip install pytest pyyaml openpyxl
      - name: Structural checks (sync drift, SKILL.md frontmatter, links, eval cases)
        run: python _eval_tools/check_repo.py
      - name: Unit tests
        run: python -m pytest -q _shared/tests -rs
      - name: Sample claims still hold
        run: |
          for f in samples/rebuild-comparison/*/claims.yaml; do
            python _shared/scripts/stats_check.py claims "$f" --strict
          done
